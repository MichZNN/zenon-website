name: Deploy website via SFTP

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

jobs:
  deploy:
    name: Upload website
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare deploy folder
        run: |
          DEPLOY_DIR="$RUNNER_TEMP/deploy"

          rm -rf "$DEPLOY_DIR"
          mkdir -p "$DEPLOY_DIR"

          find . -type f \( \
            -iname '*.php' -o \
            -iname '*.html' -o \
            -iname '*.css' -o \
            -iname '*.js' -o \
            -iname '*.json' -o \
            -iname '*.png' -o \
            -iname '*.jpg' -o \
            -iname '*.jpeg' -o \
            -iname '*.gif' -o \
            -iname '*.svg' -o \
            -iname '*.ico' -o \
            -iname '*.webp' -o \
            -iname '*.otf' -o \
            -iname '*.webmanifest' \
          \) -print0 | rsync -av --from0 --files-from=- ./ "$DEPLOY_DIR/"

      - name: Show deploy contents
        run: |
          echo "Deploy folder contents:"
          find "$RUNNER_TEMP/deploy" -maxdepth 4 -print | sort

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SFTP_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SFTP_PORT }}" "${{ secrets.SFTP_SERVER }}" >> ~/.ssh/known_hosts

      - name: Deploy via SFTP
        run: |
          lftp -u "${{ secrets.SFTP_USERNAME }}," sftp://${{ secrets.SFTP_SERVER }}:${{ secrets.SFTP_PORT }} <<EOF
          set sftp:connect-program "ssh -a -x -i ~/.ssh/deploy_key"
          mirror -R "$RUNNER_TEMP/deploy/" "${{ secrets.SFTP_REMOTE_DIR }}/"
          bye
          EOF