name: Deploy website via SFTP

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

jobs:
  deploy:
    name: Upload website
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare deploy folder
        run: |
          rm -rf .deploy
          mkdir -p .deploy

          rsync -av \
            --include='*/' \
            --include='*.php' \
            --include='*.html' \
            --include='*.css' \
            --include='*.js' \
            --include='*.json' \
            --include='*.png' \
            --include='*.jpg' \
            --include='*.jpeg' \
            --include='*.gif' \
            --include='*.svg' \
            --include='*.ico' \
            --include='*.webp' \
            --include='*.otf' \
            --include='*.webmanifest' \
            --exclude='*' \
            ./ .deploy/

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SFTP_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SFTP_PORT }}" "${{ secrets.SFTP_SERVER }}" >> ~/.ssh/known_hosts

      - name: Deploy via SFTP
        run: |
          lftp -u "${{ secrets.SFTP_USERNAME }}," sftp://${{ secrets.SFTP_SERVER }}:${{ secrets.SFTP_PORT }} <<EOF
          set sftp:connect-program "ssh -a -x -i ~/.ssh/deploy_key"
          mirror -R ./.deploy ${{ secrets.SFTP_REMOTE_DIR }}
          bye
          EOF